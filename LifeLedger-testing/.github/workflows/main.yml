name: LifeLedger Complete Test Suite & Baseline Load Testing

on:
  # Allows you to trigger this workflow manually via the "Run workflow" button in GitHub Actions
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target API Base URL'
        required: true
        default: 'https://lifeledger-backend.onrender.com'
        type: string
      vus:
        description: 'Virtual Users for Load Test'
        required: true
        default: '100'
        type: string
      duration:
        description: 'Load Test Duration (seconds)'
        required: true
        default: '60'
        type: string

  # Runs automatically on every push to main
  push:
    branches:
      - main

jobs:

  # -------------------------------------------------------------
  # 1. BASELINE / LOAD TESTING (100 VUs / 1 min / RPS & Latency)
  # -------------------------------------------------------------
  baseline-load-tests:
    name: 🚀 Baseline Load Test (100 VUs / 1 Min)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'load-tests/package-lock.json'

      - name: 📦 Install Dependencies
        working-directory: ./load-tests
        run: npm ci

      - name: ⚡ Run 100 Virtual Users Baseline Load Test
        working-directory: ./load-tests
        env:
          API_BASE_URL: ${{ github.event.inputs.target_url || 'https://lifeledger-backend.onrender.com' }}
          VUS: ${{ github.event.inputs.vus || '100' }}
          DURATION: ${{ github.event.inputs.duration || '60' }}
          TIMEOUT_MS: 15000
        run: node baseline-load-test.js

      - name: 📊 Upload Load Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-reports
          path: |
            test-reports/load-test-summary.md
            test-reports/load-test-metrics.json
          retention-days: 14

  # -------------------------------------------------------------
  # 2. API INTEGRATION TESTS (27 Real Endpoint Tests)
  # -------------------------------------------------------------
  api-tests:
    name: 🔌 API Endpoints Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'api-tests/package-lock.json'

      - name: 📦 Install Dependencies
        working-directory: ./api-tests
        run: npm ci

      - name: 🧪 Run API Tests
        working-directory: ./api-tests
        env:
          API_BASE_URL: ${{ github.event.inputs.target_url || 'https://lifeledger-backend.onrender.com' }}
        run: npx mocha api-tests.js --reporter spec

  # -------------------------------------------------------------
  # 3. VALIDATION TESTS (300 Test Cases)
  # -------------------------------------------------------------
  validation-tests:
    name: ✅ Data Validation Tests (300)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'validation-tests/package-lock.json'

      - name: 📦 Install Dependencies
        working-directory: ./validation-tests
        run: npm ci

      - name: 🧪 Run 300 Validation Tests
        working-directory: ./validation-tests
        env:
          API_BASE_URL: ${{ github.event.inputs.target_url || 'https://lifeledger-backend.onrender.com' }}
        run: npx mocha tests/validation-real-tests.js --reporter spec

  # -------------------------------------------------------------
  # 4. SECURITY TESTS (300 Test Cases - Injection / Auth / Headers)
  # -------------------------------------------------------------
  security-tests:
    name: 🛡️ Security Tests (300)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'security-tests/package-lock.json'

      - name: 📦 Install Dependencies
        working-directory: ./security-tests
        run: npm ci

      - name: 🛡️ Run 300 Security Tests
        working-directory: ./security-tests
        env:
          API_BASE_URL: ${{ github.event.inputs.target_url || 'https://lifeledger-backend.onrender.com' }}
        run: npx mocha tests/security-real-tests.js --reporter spec
