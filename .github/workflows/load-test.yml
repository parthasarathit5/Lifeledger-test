name: Baseline & Load Testing

on:
  # Allows you to run this workflow manually from the Actions tab with custom inputs
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Backend Target Base URL'
        required: true
        default: 'https://lifeledger-backend.onrender.com'
        type: string
      vus:
        description: 'Number of Virtual Users (Concurrent Users)'
        required: true
        default: '100'
        type: string
      duration:
        description: 'Duration in seconds (e.g. 60 for 1 minute)'
        required: true
        default: '60'
        type: string

  # Optional: Automatically run on push to main
  push:
    branches:
      - main
    paths:
      - 'load-tests/**'
      - 'lifeledger_backend/**'
      - '.github/workflows/load-test.yml'

jobs:
  baseline-load-test:
    name: Run 100 Virtual Users Baseline Load Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'load-tests/package-lock.json'

      - name: 📦 Install Dependencies
        working-directory: ./load-tests
        run: npm ci

      - name: 🚀 Execute Baseline Load Test (100 VUs / 1 min)
        working-directory: ./load-tests
        env:
          API_BASE_URL: ${{ github.event.inputs.target_url || 'https://lifeledger-backend.onrender.com' }}
          VUS: ${{ github.event.inputs.vus || '100' }}
          DURATION: ${{ github.event.inputs.duration || '60' }}
          TIMEOUT_MS: 15000
        run: node baseline-load-test.js

      - name: 📊 Upload Load Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-reports
          path: |
            test-reports/load-test-summary.md
            test-reports/load-test-metrics.json
          retention-days: 14
